main{max-width:none;margin:0;padding:20px 32px 56px}.tabs{display:none!important}

const NOTE={'am / is / are / do / does':'I → am; he/she/it → is; you/we/they → are. Động từ thường dùng do/does để hỏi và phủ định.','Hiện tại tiếp diễn':'am/is/are + V-ing: hành động đang xảy ra lúc nói (now, Look!, Listen!).','Hiện tại đơn':'Thói quen/sự thật: he/she/it thêm -s/-es; phủ định, nghi vấn dùng do/does + V gốc.','have got':'have/has got = sở hữu. Phủ định: haven\'t/hasn\'t got. Câu hỏi: Have/Has + S + got?','was / were':'I/he/she/it → was; you/we/they → were.','Viết dạng rút gọn':'I am → I\'m, is not → isn\'t, have not → haven\'t, was not → wasn\'t.','Thêm -s / -es':'-o/-ch/-sh/-s/-x → -es; phụ âm + y → -ies (cry → cries); còn lại thêm -s.','Trả lời ngắn':'Lặp lại trợ động từ của câu hỏi: Yes, I am. / No, he doesn\'t.','Từ để hỏi':'Who = ai, Where = ở đâu, Why = tại sao, How much = giá, What time = mấy giờ, How often = tần suất.','Trạng từ chỉ tần suất (viết lại cả câu)':'Trạng từ đứng trước động từ thường, nhưng đứng sau am/is/are.','Quá khứ đơn':'Quá khứ: V-ed hoặc dạng bất quy tắc; phủ định didn\'t + V gốc.','Quá khứ tiếp diễn và đơn':'Việc đang diễn ra: was/were + V-ing; việc xen vào: quá khứ đơn.','Hiện tại hoàn thành':'have/has + V3: việc đã xảy ra có liên quan hiện tại (just, yet, already).','for / since / ago':'for + khoảng thời gian; since + mốc thời gian; ago + khoảng thời gian (đi với quá khứ đơn).','Hiện tại hoàn thành hay quá khứ đơn':'Thời gian xác định (yesterday, in 2020) → quá khứ đơn; chưa xác định/còn liên quan hiện tại → hiện tại hoàn thành.','Câu hỏi quá khứ (Did…?)':'Did + S + V gốc?','Quá khứ phủ định':'didn\'t + V gốc (không chia V2 sau didn\'t).','How long…? (viết câu hỏi)':'How long + have/has + S + V3? cho việc kéo dài đến hiện tại.','gone hay been':'has gone = đã đi và chưa về; has been = đã đi và đã về.','just / already / yet':'just = vừa mới; already = rồi (câu khẳng định); yet = chưa/chưa? (phủ định, nghi vấn, cuối câu).','Câu bị động':'be + V3: hiện tại is/are, quá khứ was/were.','Sửa lỗi sai (viết lại câu đúng)':'Kiểm tra trợ động từ, thì và dạng động từ (V gốc / V-ed / V3).','Viết lại thành câu bị động':'Tân ngữ → chủ ngữ; be (cùng thì) + V3; "by …" có thể bỏ.','Tổng hợp các thì':'Dấu hiệu thời gian quyết định thì: now → tiếp diễn; since/for → hoàn thành; yesterday → quá khứ.','is / are / was / were / has / have':'is/are/was/were + V3 = bị động; has/have + V3 = hoàn thành.','Bị động từ gợi ý (viết cả câu)':'S + be + V3 (+ by …); chọn is/are/was/were theo thời gian.','Sửa lỗi sai (2)':'Kiểm tra trợ động từ, thì và dạng động từ (V gốc / V-ed / V3).','Chia động từ tổng hợp':'Tìm dấu hiệu thời gian rồi chọn thì; nhớ V3 khi là bị động hoặc hoàn thành.','Chọn đáp án đúng':'Xác định dấu hiệu thời gian rồi chọn thì.','Viết câu hỏi (thì tổng hợp)':'Đưa trợ động từ lên trước chủ ngữ; từ để hỏi đứng đầu câu.','Viết câu phủ định (thì tổng hợp)':'Thêm not sau trợ động từ; thì đơn dùng don\'t/doesn\'t/didn\'t + V gốc.','Chọn thì đúng (khó)':'Xác định dấu hiệu thời gian rồi chọn thì.','Dịch sang tiếng Anh':'Xác định thì từ ngữ cảnh: "đã … được 5 năm" → hiện tại hoàn thành; "được xây" → bị động.'};

Object.assign(NOTE,{'am / is / are / do / does':'Với động từ to be: I → am; he/she/it → is; you/we/they → are. Với động từ thường, ta mượn do/does để đặt câu hỏi và câu phủ định (does đi với he/she/it). Ví dụ: Does she work here? / They are at home.','Hiện tại tiếp diễn':'Cấu trúc: am/is/are + V-ing. Dùng cho việc đang xảy ra ngay lúc nói hoặc quanh thời điểm nói; dấu hiệu: now, at the moment, Look!, Listen! Phủ định thêm not sau am/is/are. Ví dụ: She is cooking dinner now.','Hiện tại đơn':'Dùng cho thói quen, sự thật, lịch cố định. Với he/she/it, động từ thêm -s/-es (works, goes). Câu hỏi và phủ định mượn do/does + V gốc, lúc đó động từ chính không thêm -s. Ví dụ: She doesn\'t like coffee.','have got':'have/has got diễn tả sở hữu (= have). Phủ định: haven\'t/hasn\'t got. Câu hỏi đảo have/has lên đầu: Has she got a car? Chủ ngữ he/she/it dùng has, các chủ ngữ còn lại dùng have.','was / were':'Quá khứ của to be: I/he/she/it → was; you/we/they → were. Phủ định: wasn\'t/weren\'t. Câu hỏi đảo was/were lên trước chủ ngữ: Were you at home last night?','Viết dạng rút gọn':'Dạng rút gọn nối trợ động từ với chủ ngữ hoặc với not: I am → I\'m, she is → she\'s, is not → isn\'t, have not → haven\'t, was not → wasn\'t. Lưu ý: will not → won\'t và can not → can\'t là trường hợp đặc biệt.','Thêm -s / -es':'Với he/she/it ở hiện tại đơn: động từ kết thúc bằng -o, -ch, -sh, -s, -x thêm -es (goes, watches); phụ âm + y đổi y thành -ies (study → studies); còn lại thêm -s. Riêng have → has.','Trả lời ngắn':'Câu trả lời ngắn lặp lại trợ động từ trong câu hỏi, không lặp động từ chính: Do you like tea? → Yes, I do. / No, I don\'t. Is she tired? → Yes, she is. Chủ ngữ trong câu hỏi được đổi thành đại từ (Tom → he).','Từ để hỏi':'Who hỏi người; Where hỏi nơi chốn; Why hỏi lý do; How much hỏi giá/số lượng không đếm được; How many hỏi số lượng đếm được; What time hỏi giờ; How often hỏi tần suất. Câu trả lời cho biết nên dùng từ nào.','Trạng từ chỉ tần suất (viết lại cả câu)':'Always, usually, often, sometimes, never đứng trước động từ thường (She usually walks) nhưng đứng sau am/is/are (She is never late). Trong câu hỏi, trạng từ đứng sau chủ ngữ: Do you often go out?','Quá khứ đơn':'Dùng cho việc đã xảy ra và kết thúc ở thời điểm xác định (yesterday, last week, in 2019). Động từ có quy tắc thêm -ed; bất quy tắc phải học thuộc (go → went). Phủ định: didn\'t + V gốc.','Quá khứ tiếp diễn và đơn':'Việc đang diễn ra trong quá khứ dùng was/were + V-ing; việc ngắn xen vào dùng quá khứ đơn. Ví dụ: I was walking home when I met Sarah. While thường đi với quá khứ tiếp diễn.','Hiện tại hoàn thành':'Cấu trúc: have/has + V3. Dùng khi việc xảy ra trong quá khứ nhưng còn liên quan đến hiện tại (kết quả, kinh nghiệm), không nêu thời gian cụ thể. Hay đi với just, already, yet, ever, never.','for / since / ago':'for + khoảng thời gian (for three years); since + mốc thời gian (since 2018); ago + khoảng thời gian, dùng với quá khứ đơn (two hours ago). For và since đi với hiện tại hoàn thành.','Hiện tại hoàn thành hay quá khứ đơn':'Có thời gian xác định trong quá khứ (yesterday, last year, in 2020) hoặc người/việc đã kết thúc (Mozart) → quá khứ đơn. Chưa nêu thời gian, còn liên quan hiện tại hoặc nói về kinh nghiệm → hiện tại hoàn thành.','Câu hỏi quá khứ (Did…?)':'Câu hỏi quá khứ đơn: Did + S + V gốc (không chia V2 sau did). Từ hỏi đứng đầu: Where did you go? Chủ ngữ ở câu trả lời được đổi sang đại từ phù hợp khi cần.','Quá khứ phủ định':'Phủ định quá khứ đơn: didn\'t (did not) + V gốc. Vì did đã mang thì quá khứ nên động từ chính trở về nguyên mẫu: I didn\'t see her (không phải didn\'t saw).','How long…? (viết câu hỏi)':'How long + have/has + S + V3? hỏi việc kéo dài từ quá khứ đến hiện tại. Ví dụ: How long have you lived here? Với to be: How long has she been ill? Câu trả lời thường dùng for hoặc since.','gone hay been':'has/have gone to = đã đi đến đó và vẫn chưa về; has/have been to = đã đến đó rồi và đã quay về (kinh nghiệm). Ví dụ: She\'s gone to Paris (cô ấy đang ở Paris) / She\'s been to Paris (cô ấy từng đến).','just / already / yet':'just = vừa mới (đứng giữa have/has và V3); already = rồi, sớm hơn dự kiến (câu khẳng định); yet = chưa/đã chưa (phủ định và nghi vấn, đứng cuối câu).','Câu bị động':'Cấu trúc: be + V3. Chọn be theo thì: hiện tại is/are, quá khứ was/were, hoàn thành has/have been, tiếp diễn is/are being. Dùng khi người làm không quan trọng hoặc không rõ: English is spoken here.','Sửa lỗi sai (viết lại câu đúng)':'Cách kiểm tra từng bước: (1) xác định thì từ dấu hiệu thời gian, (2) kiểm tra trợ động từ có hợp chủ ngữ không, (3) kiểm tra dạng động từ (V gốc sau did/does, V3 sau have/be bị động).','Viết lại thành câu bị động':'Ba bước: đưa tân ngữ lên làm chủ ngữ; đổi động từ thành be (cùng thì với câu gốc) + V3; có thể thêm by + người làm hoặc bỏ đi. Ví dụ: They built it in 1900. → It was built in 1900.','Tổng hợp các thì':'Dấu hiệu thời gian quyết định thì: now/Look → tiếp diễn; every day/usually → đơn; yesterday/ago → quá khứ đơn; since/for/ever/never/just → hiện tại hoàn thành; while/when kèm việc đang diễn ra → quá khứ tiếp diễn.','is / are / was / were / has / have':'is/are/was/were + V3 là câu bị động (thì hiện tại hoặc quá khứ); has/have + V3 là hiện tại hoàn thành (chủ động). Chủ ngữ số ít dùng is/was/has, số nhiều dùng are/were/have.','Bị động từ gợi ý (viết cả câu)':'Sắp xếp theo mẫu: S + be + V3 (+ by …). Chọn be theo thời gian của câu (hiện tại thường: is/are; quá khứ: was/were). Câu hỏi bị động đảo be lên trước chủ ngữ: When was it built?','Sửa lỗi sai (2)':'Cách kiểm tra từng bước: (1) xác định thì từ dấu hiệu thời gian, (2) kiểm tra trợ động từ có hợp chủ ngữ không, (3) kiểm tra dạng động từ (V gốc sau did/does, V3 sau have hoặc be bị động).','Chia động từ tổng hợp':'Tìm dấu hiệu thời gian trước rồi mới chia: yesterday/last → quá khứ đơn; while/when → quá khứ tiếp diễn; since/for/ever/just → hiện tại hoàn thành; trong câu bị động nhớ dùng V3 sau be.','Chọn đáp án đúng':'Đọc kỹ dấu hiệu thời gian trong câu (since, yesterday, at the moment, while, yet…) rồi mới chọn thì; loại dần các đáp án sai về dạng động từ hoặc về trợ động từ.','Viết câu hỏi (thì tổng hợp)':'Quy tắc: đưa trợ động từ (am/is/are, was/were, do/does/did, have/has) lên trước chủ ngữ; nếu có từ hỏi thì đặt ở đầu câu. Câu không có trợ động từ thì mượn do/does/did và đưa động từ về nguyên mẫu.','Viết câu phủ định (thì tổng hợp)':'Thêm not sau trợ động từ (is not, was not, has not). Với thì đơn mượn do/does/did + not + V gốc. Với bị động thêm not sau be: The window wasn\'t broken.','Chọn thì đúng (khó)':'Xác định dấu hiệu thời gian rồi chọn thì: việc đã kết thúc (lived, wrote) khác với việc còn kéo dài (has lived); việc đang xảy ra tại một thời điểm quá khứ dùng quá khứ tiếp diễn.','Dịch sang tiếng Anh':'Xác định thì từ ngữ cảnh tiếng Việt: "đã … được 5 năm" → hiện tại hoàn thành + for; "hôm qua" → quá khứ đơn; "đang được sửa" → is being + V3; "đã bao giờ" → Have you ever + V3.'});

Object.assign(NOTE,{'used to':'Cấu trúc: used to + V gốc, diễn tả thói quen hoặc trạng thái trong quá khứ nhưng nay không còn. Phủ định và nghi vấn mượn did: did not use to / Did you use to…? (use, không có -d). Ví dụ: She used to live in Paris. / Did you use to play tennis?','Tương lai: What are you doing tomorrow?':'Dùng am/is/are + V-ing cho kế hoạch đã sắp xếp trong tương lai, thường có thời gian cụ thể (tomorrow, tonight, next Friday). Câu hỏi đảo am/is/are lên trước chủ ngữ. Ví dụ: I am meeting Sarah at 7 tonight.','going to':'am/is/are going to + V gốc: dự định đã quyết định, hoặc dự đoán dựa trên dấu hiệu hiện tại (Look at those clouds!). Phủ định thêm not sau am/is/are; câu hỏi đảo am/is/are. Ví dụ: It is going to rain. / Are you going to buy a car?','will / shall (1)':'will + V gốc dùng để nói về tương lai, dự đoán hoặc điều bạn nghĩ sẽ xảy ra (I think, I’m sure, probably). Phủ định: will not (won’t). Shall chỉ đi với I/we, dùng để đề nghị hoặc rủ rê. Ví dụ: She will pass the exam. / Shall I open the window?','will / shall (2)':'Dùng I will (I’ll) khi quyết định hoặc đề nghị giúp ngay lúc nói; won’t = từ chối hoặc hứa không làm. Shall I…? để đề nghị, Shall we…? để rủ. Không dùng going to cho quyết định tức thời. Ví dụ: “It’s cold.” “I’ll close the window.”','might':'might + V gốc nghĩa là có thể (khả năng không chắc chắn), gần nghĩa với perhaps. Phủ định: might not. Không thêm to và không chia theo ngôi. Ví dụ: He might be at home. / It might rain later.','can / could':'can/could + V gốc (không có to). can = khả năng hiện tại, could = khả năng quá khứ hoặc lời yêu cầu lịch sự. Phủ định: cannot (can’t), could not (couldn’t). Ví dụ: I could swim when I was five. / Could you help me?','must · mustn’t · needn’t':'must = bắt buộc/cần thiết; mustn’t = bị cấm (không được phép); needn’t = không cần thiết nhưng không bị cấm. Tất cả + V gốc, không có to. Ví dụ: You mustn’t park here. / You needn’t hurry.','should':'should + V gốc để khuyên nên làm; shouldn’t để khuyên không nên. Không có to và không đổi theo ngôi. Câu hỏi xin lời khuyên: What should I do? Ví dụ: You look tired. You should go to bed early.','have to':'have/has to + V gốc = bắt buộc phải làm do quy định hay hoàn cảnh. Phủ định don’t/doesn’t have to = không cần phải (khác với mustn’t). Quá khứ: had to; hỏi và phủ định quá khứ dùng did + have to. Ví dụ: She has to wear a uniform. / Did Tom have to pay?','Would you like…? I’d like…':'Would you like…? dùng để mời hoặc đề nghị lịch sự; I’d like… (= I would like) để yêu cầu lịch sự. would like + to V hoặc + danh từ. Khác với Do you like…? (hỏi sở thích). Ví dụ: Would you like some tea? / I’d like to go home.','there is / there are':'There is + danh từ số ít hoặc không đếm được; there are + danh từ số nhiều. Phủ định: there isn’t / there aren’t. Câu hỏi đảo: Is there…? / Are there…? Động từ chia theo danh từ đứng sau. Ví dụ: There are two beds in the room.','there was / there were / there will be':'Quá khứ: there was (số ít) / there were (số nhiều); tương lai: there will be cho cả số ít và số nhiều. Phủ định: wasn’t / weren’t / won’t be; hỏi: Was there…? Were there…? Ví dụ: There were many people at the party.','It…':'It dùng làm chủ ngữ khi nói về giờ giấc, ngày, thời tiết, khoảng cách. Không được bỏ chủ ngữ it như tiếng Việt. How far is it…? hỏi khoảng cách; What time is it? hỏi giờ. Ví dụ: It is raining. / It is three kilometres from here.','I am, I don’t…':'Khi không muốn lặp lại cả câu, chỉ giữ trợ động từ: I am / I’m not / she does / he doesn’t / I can / I did. Trợ động từ phải khớp với câu gốc. Ví dụ: She isn’t tired but he is. / He likes tea but she doesn’t.','Have you? Are you? Don’t you?…':'Dùng trợ động từ + đại từ để thể hiện sự quan tâm khi nghe người khác nói; trợ động từ khớp với câu của họ (did → did you?, isn’t → isn’t she?). Ví dụ: “I bought a new car.” “Oh, did you?”','too / either · so am I / neither do I':'too dùng ở cuối câu khẳng định; either dùng ở cuối câu phủ định. So + trợ động từ + I = tôi cũng vậy; Neither + trợ động từ + I = tôi cũng không. Trợ động từ khớp với câu gốc. Ví dụ: “I’m tired.” “So am I.”','Câu phủ định (isn’t, haven’t, don’t…)':'Thêm not sau am/is/are/was/were/have/has/can/will/should. Động từ thường ở hiện tại dùng don’t/doesn’t + V gốc; quá khứ dùng didn’t + V gốc. Ví dụ: She does not like tea. / We did not go out.','Câu hỏi 1 (is it…? have you…? do they…?)':'Câu hỏi đảo trợ động từ lên trước chủ ngữ. Nếu câu khẳng định không có trợ động từ thì mượn do/does/did (và động từ về nguyên mẫu). Từ để hỏi đứng đầu câu. Ví dụ: Does he like pizza? / Where does Tom live?','Câu hỏi 2 (Who saw you? Who did you see?)':'Khi who/what là chủ ngữ thì không cần do/does/did: Who saw Paul? Khi who/what là tân ngữ thì cần trợ động từ: Who did Sylvia see? Hỏi “ai làm” khác với hỏi “làm gì/ai”. Ví dụ: What happened? / What did Tom buy?','Câu hỏi 3 (Who is she talking to?)':'Giới từ (to, for, with, from, about…) thường đứng cuối câu hỏi, sau động từ. Cấu trúc: Who/What + trợ động từ + S + V + giới từ? Ví dụ: Who is she talking to? / What are they looking for? / What is the film like?','What…? Which…? How…?':'What + danh từ hỏi chung (What colour/kind…?); Which dùng khi chọn trong một nhóm giới hạn; How + tính từ/trạng từ hỏi mức độ (How old/far/much…?). What … like? hỏi đặc điểm. Ví dụ: Which bus goes to the airport?','How long does it take…?':'How long does it take (to) …? hỏi thời gian cần để làm gì. Trả lời: It takes + thời gian (+ by train…). Khi có người: It takes/took + người + thời gian + to V. Ví dụ: It took me three hours to write the report.','Do you know where…?':'Trong câu hỏi gián tiếp (Do you know…? / Can you tell me…?), từ hỏi được theo sau bởi trật tự câu khẳng định: không đảo trợ động từ, không dùng do/does/did. Câu yes/no dùng if hoặc whether. Ví dụ: Do you know where the station is?','said / told (câu tường thuật)':'Khi tường thuật, thì lùi một bậc: am/is → was, like → liked, will → would, can → could, have lost → had lost. said that + câu; told + người + that. Ví dụ: Tom said that he was tired. / She told me that she was hungry.','Động từ nguyên mẫu và -ing':'Sau can/must/will/should… dùng V gốc. Sau enjoy, stop, be good at, thinking of… dùng V-ing. Sau want, would like, decide… dùng to + V. Phải học theo từng động từ. Ví dụ: I enjoy reading. / I want to learn English.'});

   const cl=$('button',{className:'link'},'Xóa tất cả cảnh báo');cl.onclick=async()=>{try{await api('admin_clear_alerts',{apw:APW});load()}catch(e){cl.textContent='Không xóa được, thử lại'}};al.append(cl)}else al.style.display='none'}
 load()}
async function acctDetail(a){app.innerHTML='';const bk=$('button',{className:'back'},'← Danh sách tài khoản');bk.onclick=()=>{lv=7;home()};const info=$('p',{className:'sub',textContent:'Đang tải…'});app.append(bk,$('h1',{textContent:a.code}),info);
 let r;try{r=await api('admin_get',{apw:APW,code:a.code})}catch(e){info.textContent='Không kết nối được máy chủ.';return}
 if(!r.ok){info.textContent=r.err||'Không tải được.';return}
 let x={};try{x=r.data?JSON.parse(r.data):{}}catch(e){}
 info.textContent='Thiết bị đã dùng: '+r.devices+'/'+r.maxDevices+' · Đăng nhập gần nhất: '+when(r.last)+(r.active?'':' · ĐANG KHÓA');
 const top=$('div',{className:'card'});top.append($('p',{textContent:sumText(sumObj(x))}));
 const lb=$('button',{className:'go'},r.active?'Khóa tài khoản này':'Mở khóa tài khoản');lb.onclick=async()=>{lb.disabled=true;try{await api('admin_lock',{apw:APW,code:a.code,on:!r.active});acctDetail(a)}catch(e){lb.disabled=false}};
 const rs=$('button',{className:'chip'},'Đặt lại thiết bị (cho phép đăng nhập từ thiết bị mới)');rs.style.cssText='display:block;margin:6px auto';rs.onclick=async()=>{try{await api('admin_reset',{apw:APW,code:a.code});acctDetail(a)}catch(e){rs.textContent='Không thực hiện được, thử lại'}};
 const dl=$('button',{className:'link'},'Xóa tài khoản và toàn bộ bài làm');dl.style.display='block';dl.style.margin='0 auto';let arm=0;dl.onclick=async()=>{if(!arm){arm=1;dl.textContent='Bấm lần nữa để xóa (không khôi phục được)';return}try{await api('admin_del',{apw:APW,code:a.code});lv=7;home()}catch(e){dl.textContent='Không xóa được, thử lại'}};
 top.append(lb,rs,dl);app.append(top);
 const ix=idx();GRP.forEach(G=>{const rows=[];G[2].forEach(t=>{const p=ix[t];if(!p)return;const e=L[p[0]].x[p[1]];if(!(x.s&&x.s[t]))return;let k=0;e[2].forEach((_,i)=>{const q=x.a&&x.a[t+'.'+i+(e[3]?'r':'')];if(q&&q.ok)k++});rows.push(t+': '+k+'/'+e[2].length)});if(!rows.length)return;const c=$('div',{className:'card',style:'margin-top:12px'});c.append($('b',{textContent:G[0]+' · '+G[1]}));rows.forEach(q=>c.append($('p',{className:'msg',textContent:q})));app.append(c)});
 const ts=Object.entries(x.t||{}).filter(([k,s])=>s&&s.d);if(ts.length){const c=$('div',{className:'card',style:'margin-top:12px'});c.append($('b',{textContent:'Đề kiểm tra'}));ts.sort((p,q)=>p[0]-q[0]).forEach(([k,s])=>c.append($('p',{className:'msg',textContent:'Đề '+(+k+1)+': '+s.sc+'/20'+(s.m?' · '+s.m+' phút':'')})));app.append(c)}}

home=function(){CT=-1;_home();side()};open=function(e){CT=-1;_open(e);side()};openTest=function(i){CT=i;_ot(i);side()};

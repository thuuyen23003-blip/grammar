:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2540;--mut:#6b7494;--line:#e3e7f2;--pri:#4f6df5;--ok:#17a673;--okb:#e5f7ef;--no:#e5484d;--nob:#fdecec;--e:#17a673;--m:#f59e0b;--a:#8b5cf6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:26px;margin:4px 0 2px;font-weight:800}.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 4px 18px rgba(40,60,140,.06)}
.hero{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hero input{flex:1;min-width:150px}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:9px 12px;outline:none;width:100%}
input[type=text]:focus{border-color:var(--pri)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c,var(--pri));border-radius:9px;transition:width .4s}
.tabs{display:flex;gap:8px;margin:16px 0;background:var(--card);padding:5px;border-radius:16px;border:1px solid var(--line)}
.tab{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:800;padding:10px 4px;border-radius:12px;cursor:pointer}
.tab small{display:block;font-weight:600;font-size:12px}
.tab.on{background:var(--c);color:#fff}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.ex{cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .15s}.ex:hover{transform:translateY(-2px)}
.ex b{display:block;margin-bottom:2px}.ex span{color:var(--mut);font-size:13px;display:block;margin-bottom:10px}
.back{background:none;border:0;color:var(--pri);font:inherit;font-weight:800;cursor:pointer;padding:6px 0}
.q{padding:12px 0;border-bottom:1px solid var(--line)}.q:last-child{border:0}
.q p{margin:0 0 8px;font-weight:600}.row{display:flex;gap:8px;align-items:center}
.q.ok input{border-color:var(--ok);background:var(--okb)}.q.no input{border-color:var(--no);background:var(--nob)}
.msg{font-size:14px;min-height:20px;margin-top:6px;color:var(--mut)}.q.ok .msg{color:var(--ok)}.q.no .msg{color:var(--no)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;padding:7px 16px;border-radius:99px;cursor:pointer}
.chip.on{border-color:var(--pri);background:var(--pri);color:#fff}.q.ok .chip.on{background:var(--ok);border-color:var(--ok)}.q.no .chip.on{background:var(--no);border-color:var(--no)}
.done{text-align:center;font-weight:800;color:var(--ok);padding:10px}
.foot{margin-top:22px;color:var(--mut);font-size:13px}.foot code{display:block;margin:6px 0;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);user-select:all;white-space:pre-wrap}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;font:inherit;cursor:pointer;padding:0}
.why{font-size:14px;line-height:1.65;color:var(--mut);margin-top:8px;padding:10px 12px;background:var(--bg);border-radius:12px;text-align:left}.why div{margin:3px 0}.why .h{font-weight:800;color:var(--ink)}.why .b{padding-left:14px}.why .ex{margin-top:8px;font-style:italic;color:var(--ink)}
.timer{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:800;margin:10px 0;text-align:center}
.go{border:0;background:var(--pri);color:#fff;font:inherit;font-weight:800;padding:12px 28px;border-radius:99px;cursor:pointer;margin:14px auto;display:block}
.acc{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:12px 0;box-shadow:0 4px 18px rgba(40,60,140,.06);overflow:hidden}
.acch{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;font:inherit;color:inherit;padding:14px 16px;cursor:pointer;text-align:left}
.acch b{display:block;font-size:17px}.acch span{color:var(--mut);font-size:13px;white-space:nowrap}.acch div span{white-space:normal;display:block}
.chev{font-size:22px;line-height:1;transition:transform .25s}.acc.open .chev{transform:rotate(90deg)}
.accb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}.acc.open .accb{grid-template-rows:1fr}.accb>div{overflow:hidden}
.row2{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);font:inherit;color:inherit;text-align:left;padding:12px 16px;cursor:pointer}
.row2:hover{background:var(--bg)}.row2 small{display:block;color:var(--mut);font-size:12.5px}.dot{width:10px;height:10px;border-radius:50%;flex:none}.mn{margin-left:auto;color:var(--mut);font-size:13px;white-space:nowrap}
body{display:flex}#app{flex:1;min-width:0}
#side{width:300px;flex:none;height:100vh;position:sticky;top:0;overflow:auto;background:var(--card);border-right:1px solid var(--line);padding:12px 10px calc(12px + env(safe-area-inset-bottom,0px));transition:margin .25s;z-index:20}
#side:empty{display:none}body:not(.sb) #side{margin-left:-300px}
.sh{display:flex;align-items:center;gap:10px;padding:2px 4px 12px}.sh b{font-size:17px}
.ico{width:36px;height:36px;border-radius:10px;border:0;background:none;color:var(--mut);cursor:pointer;display:grid;place-items:center;flex:none}.ico:hover{background:var(--bg)}
.sn{display:grid;gap:2px;margin-bottom:12px}
.si,.sit,.sgh{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--ink);font:inherit;text-align:left;padding:9px 10px;border-radius:10px;cursor:pointer}
.si:hover,.sit:hover,.sgh:hover{background:var(--bg)}.si.on,.sit.on{background:var(--bg);font-weight:800}
.sl{color:var(--mut);font-size:12.5px;padding:8px 10px 4px}.sgh{font-weight:700}.sgh .chev{margin-left:auto;font-size:18px;transition:transform .2s;color:var(--mut)}.sg.open .sgh .chev{transform:rotate(90deg)}
.sgb{display:none}.sg.open .sgb{display:block}.sit{padding:7px 10px 7px 18px;font-size:14.5px}.sit .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sf{position:sticky;bottom:0;background:var(--card);display:flex;align-items:center;gap:10px;padding:10px;margin-top:10px;border-top:1px solid var(--line)}
.av{width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
#tg2{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:15;display:none;background:var(--card);border:1px solid var(--line)}
body.in:not(.sb) #tg2{display:grid}body.in main{padding-top:60px}
@media(min-width:600px){body.sb .tabs{display:none}body.sb main{padding-top:20px}}
@media(max-width:599px){#side{position:fixed;left:0;top:0;margin-left:0!important;transform:translateX(-105%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.25)}body.sb #side{transform:none}.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:19;display:none}body.sb .scrim{display:block}}
h1{font-size:22px;margin:2px 0}.sub{margin:0 0 10px;font-size:14px}main{padding:14px 14px 40px}
.card{padding:12px;border-radius:14px}.hero{gap:8px}
.tabs{margin:10px 0;padding:4px;border-radius:12px}.tab{padding:7px 4px;font-size:14px;border-radius:9px}
.acc{margin:8px 0;border-radius:14px}.acch{padding:9px 12px;gap:8px}.acch b{font-size:15px}.acch span{font-size:12px}.acch .bar{margin-top:5px!important}.bar{height:6px}
.row2{padding:8px 12px;gap:8px}.row2 b{font-size:14px;font-weight:700}.row2 small{font-size:12px}.mn{font-size:12px}
.q{padding:8px 0}.q p{margin:0 0 5px;font-size:15px}.go{padding:9px 22px;margin:10px auto}.why{font-size:13px;padding:8px 10px;margin-top:6px}
#side{width:200px;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}body:not(.sb) #side{margin-left:-200px}
.sh{padding:0 2px 8px}.sh b{font-size:15px}.ico{width:32px;height:32px}
.sn{margin-bottom:8px;gap:0}.si,.sit,.sgh{padding:6px 8px;gap:8px;font-size:13.5px}.sit{padding:4px 8px 4px 16px;font-size:13px}.sl{padding:4px 8px 2px;font-size:11.5px}
.sf{padding:8px;margin-top:6px}.av{width:26px;height:26px;font-size:12px}
main{max-width:none;margin:0;padding:20px 32px 56px}.tabs{display:none!important}
.sec{font-size:22px;margin:16px 0 8px;font-weight:800}h1{font-size:26px}.sub{font-size:15px}
.acch b{font-size:16px}.row2 b{font-size:15px}.row2 small{font-size:13px}.q p{font-size:16px}.card{padding:14px}
input[type=password]{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:9px 12px;outline:none;width:100%}input[type=password]:focus{border-color:var(--pri)}
.q input[type=text]{max-width:720px}
@media(max-width:599px){main{padding:16px 14px 40px}}
.sc{font-size:34px;font-weight:800;text-align:center}.res p{margin:2px 0}

.timer{position:fixed!important;top:calc(8px + env(safe-area-inset-top,0px))!important;right:12px;left:auto;z-index:40;margin:0;padding:6px 14px;font-size:15px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tg{display:block;font-size:12.5px;color:var(--mut);margin:-2px 0 6px;font-weight:600}
.ins{font-size:13.5px;color:var(--mut);margin:2px 0 8px;line-height:1.5}
.dg{width:100%;max-width:640px;display:block;margin:10px auto;color:var(--ink)}
.pass{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0 12px;white-space:pre-line;font-size:15px;line-height:1.65}

/* ====================== GIAO DIỆN MỚI: vở ô ly (sáng) · bảng phấn (tối) ====================== */
:root{--bg:#fffdf6;--card:#fff;--ink:#1b2540;--mut:#667089;--line:#e6e2d3;--pri:#2f54eb;--ok:#2f9e44;--okb:#ebfbee;--no:#e03131;--nob:#fff0f0;--hl:#ffe066;--rule:rgba(47,84,235,.085);--margin:rgba(224,49,49,.26);--sh:0 1px 0 rgba(27,37,64,.04),0 10px 26px -14px rgba(27,37,64,.28);--e:#2f9e44;--m:#f08c00;--a:#7048e8}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2b27;--card:#27403a;--ink:#f0f4ec;--mut:#a8bcb2;--line:#3a564e;--ok:#69db7c;--okb:#1f4a36;--no:#ff8787;--nob:#4a2a2f;--hl:#e8c547;--rule:rgba(240,244,236,.06);--margin:rgba(255,135,135,.22);--sh:0 10px 26px -14px rgba(0,0,0,.6);--e:#69db7c;--m:#ffa94d;--a:#b197fc}}
:root[data-theme="dark"]{--bg:#1d2b27;--card:#27403a;--ink:#f0f4ec;--mut:#a8bcb2;--line:#3a564e;--ok:#69db7c;--okb:#1f4a36;--no:#ff8787;--nob:#4a2a2f;--hl:#e8c547;--rule:rgba(240,244,236,.06);--margin:rgba(255,135,135,.22);--sh:0 10px 26px -14px rgba(0,0,0,.6);--e:#69db7c;--m:#ffa94d;--a:#b197fc}
body{font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3,.gt b,.brand b,.hero2 h1,.go,.big i,.scard h3{font-family:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif}
main{background-image:repeating-linear-gradient(180deg,transparent 0 33px,var(--rule) 33px 34px);padding:22px 36px 64px}
@media(min-width:900px){main{background-image:linear-gradient(90deg,transparent 0 17px,var(--margin) 17px 19px,transparent 19px),repeating-linear-gradient(180deg,transparent 0 33px,var(--rule) 33px 34px);padding-left:44px}}
@media(max-width:599px){main{padding:16px 14px 48px}}
#app>*{animation:rise .38s cubic-bezier(.2,.7,.2,1) both}#app>*:nth-child(2){animation-delay:.04s}#app>*:nth-child(3){animation-delay:.08s}#app>*:nth-child(4){animation-delay:.12s}#app>*:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#app>*{animation:none}.cf{display:none}}
/* thanh bên */
#side{background:var(--card);border-right:1.5px solid var(--line);width:236px;padding:14px 12px 12px}body:not(.sb) #side{margin-left:-236px}
.brand{display:flex;align-items:center;gap:11px;padding:2px 4px 16px}.brand b{font-size:17px;line-height:1.1;flex:1;font-weight:800}
.logo{width:40px;height:40px;border-radius:13px;background:var(--hl);color:#1b2540;display:grid;place-items:center;font:800 19px 'Baloo 2',sans-serif;box-shadow:inset 0 -4px 0 rgba(0,0,0,.13),0 2px 0 var(--ink)}
.sn{gap:5px;margin-bottom:10px}.si{padding:9px 11px;border-radius:14px;font-size:15px;font-weight:600;color:var(--ink);gap:11px;transition:background .15s,transform .15s}.si:hover{background:var(--bg);transform:translateX(2px)}
.si .ic{width:32px;height:32px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:16px;flex:none}
.si.on{background:var(--hl);color:#1b2540;font-weight:800;box-shadow:0 2px 0 var(--ink)}.si.on .ic{background:rgba(255,255,255,.65)}
.sf{display:flex;align-items:center;gap:10px;padding:10px;margin-top:12px;border:1.5px solid var(--line);border-radius:16px;background:var(--bg)}
.sf b{font-size:14px}.av{background:var(--pri);width:34px;height:34px;font-size:14px}
.sub2{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 0;font-size:12px;color:var(--mut)}.sub2 .link{font-size:12px}
.pop{margin:0 0 10px;background:var(--card);border:1.5px solid var(--ink);border-radius:16px;padding:12px;box-shadow:4px 4px 0 var(--hl)}
.prow{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}.prow:last-child{margin-bottom:0}.prow>span{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.pgrp{display:flex;gap:6px}.pb{flex:1;min-width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:700 13px 'Be Vietnam Pro',sans-serif;cursor:pointer}.pb.on{border-color:var(--ink);box-shadow:0 2px 0 var(--ink);background:var(--hl);color:#1b2540}
/* đầu trang */
.hero2{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--card);border:1.5px solid var(--ink);border-radius:22px;padding:18px 24px;margin:0 0 20px;box-shadow:5px 5px 0 var(--hl)}
.hero2 small{display:inline-block;background:var(--hl);color:#1b2540;padding:2px 9px;border-radius:7px;font-weight:800;font-size:11px;letter-spacing:.1em}
.hero2 h1{font-size:30px;line-height:1.15;margin:8px 0 2px;font-weight:800}.hero2 p{margin:0;color:var(--mut);font-size:15px}
.hero2 .sv{display:block;margin-top:8px;font-size:12px;color:var(--mut)}.pen{font-size:46px;transform:rotate(-12deg);flex:none}
.resume{display:grid;grid-template-columns:1fr auto;gap:2px 16px;width:100%;text-align:left;border:0;background:var(--pri);color:#fff;border-radius:20px;padding:14px 20px;margin:0 0 18px;cursor:pointer;font:inherit;box-shadow:0 5px 0 color-mix(in srgb,var(--pri) 62%,#000);transition:transform .15s}.resume:hover{transform:translateY(-2px)}
.resume .rl{grid-column:1/-1;font-size:11px;letter-spacing:.12em;font-weight:800;opacity:.85}.resume b{font:800 19px 'Baloo 2',sans-serif}.resume small{grid-column:1;opacity:.85}.resume .go2{grid-row:2/4;grid-column:2;align-self:center;background:#fff;color:var(--pri);padding:8px 16px;border-radius:99px;font-weight:800;font-size:14px}
/* nhóm Unit */
.acc{border:1.5px solid var(--line);border-left:7px solid var(--gc,var(--pri));border-radius:20px;background:var(--card);box-shadow:var(--sh);margin:14px 0;transition:box-shadow .2s,transform .2s}.acc:hover{transform:translateY(-1px)}
.acch{padding:13px 16px 13px 14px;gap:14px}.gb{width:46px;height:46px;border-radius:15px;background:color-mix(in srgb,var(--gc) 16%,var(--card));display:grid;place-items:center;font-size:23px;flex:none}
.gt{flex:1;min-width:0}.gt b{display:block;font-size:19px;font-weight:800;line-height:1.15}.gt span{display:block;color:var(--mut);font-size:13px;margin-top:2px;white-space:normal}
.ring{position:relative;width:48px;height:48px;flex:none}.ring svg,.big svg{display:block;transform:rotate(-90deg)}.rb{fill:none;stroke:var(--line);stroke-width:3.6}.rf{fill:none;stroke:var(--gc,var(--pri));stroke-width:3.6;stroke-linecap:round;transition:stroke-dasharray .7s cubic-bezier(.2,.7,.2,1)}
.ring i{position:absolute;inset:0;display:grid;place-items:center;font:800 11px 'Be Vietnam Pro',sans-serif;font-style:normal}.chev{color:var(--mut)}
.row2{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;align-items:center;padding:12px 18px 12px 20px;border-top:1.5px dashed var(--line);text-align:left}.row2:hover{background:color-mix(in srgb,var(--gc,var(--pri)) 7%,transparent)}
.rt b{display:block;font-size:15px;font-weight:700}.rt small{display:block;color:var(--mut);font-size:12.5px}.mb{display:block;height:5px;border-radius:5px;background:var(--line);margin-top:7px;overflow:hidden;max-width:280px}.mb u{display:block;height:100%;background:var(--gc,var(--pri));border-radius:5px;transition:width .6s}
.lvp{padding:3px 11px;border-radius:99px;font-size:11.5px;font-weight:800;background:color-mix(in srgb,var(--lc) 15%,transparent);color:var(--lc);white-space:nowrap}.row2 .mn{font-weight:700;color:var(--ink);min-width:54px;text-align:right}
@media(max-width:599px){.row2{grid-template-columns:1fr auto}.row2 .lvp{display:none}.hero2 h1{font-size:25px}.pen{font-size:34px}}
/* câu hỏi */
.card:has(>.q){background:transparent;border:0;box-shadow:none;padding:0}
.q{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:15px 18px;margin:12px 0;box-shadow:var(--sh);scroll-margin-top:90px}
.q>p{font-size:16.5px;font-weight:600;margin:0 0 10px;line-height:1.55}.qb{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:9px;background:var(--pri);color:#fff;font:800 13px 'Be Vietnam Pro',sans-serif;margin-right:10px;vertical-align:1px}
.q.ok{border-color:var(--ok);background:var(--okb)}.q.ok .qb{background:var(--ok)}.q.no{border-color:var(--no);background:var(--nob)}.q.no .qb{background:var(--no)}
.q input[type=text]{font-size:16px;padding:11px 14px;border-radius:13px;border:2px solid var(--line);background:var(--bg);transition:border .15s,box-shadow .15s}.q input[type=text]:focus{border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 18%,transparent)}
.q.ok input,.q.no input{background:transparent}

const NOTE={'am / is / are / do / does':'I → am; he/she/it → is; you/we/they → are. Động từ thường dùng do/does để hỏi và phủ định.','Hiện tại tiếp diễn':'am/is/are + V-ing: hành động đang xảy ra lúc nói (now, Look!, Listen!).','Hiện tại đơn':'Thói quen/sự thật: he/she/it thêm -s/-es; phủ định, nghi vấn dùng do/does + V gốc.','have got':'have/has got = sở hữu. Phủ định: haven\'t/hasn\'t got. Câu hỏi: Have/Has + S + got?','was / were':'I/he/she/it → was; you/we/they → were.','Viết dạng rút gọn':'I am → I\'m, is not → isn\'t, have not → haven\'t, was not → wasn\'t.','Thêm -s / -es':'-o/-ch/-sh/-s/-x → -es; phụ âm + y → -ies (cry → cries); còn lại thêm -s.','Trả lời ngắn':'Lặp lại trợ động từ của câu hỏi: Yes, I am. / No, he doesn\'t.','Từ để hỏi':'Who = ai, Where = ở đâu, Why = tại sao, How much = giá, What time = mấy giờ, How often = tần suất.','Trạng từ chỉ tần suất (viết lại cả câu)':'Trạng từ đứng trước động từ thường, nhưng đứng sau am/is/are.','Quá khứ đơn':'Quá khứ: V-ed hoặc dạng bất quy tắc; phủ định didn\'t + V gốc.','Quá khứ tiếp diễn và đơn':'Việc đang diễn ra: was/were + V-ing; việc xen vào: quá khứ đơn.','Hiện tại hoàn thành':'have/has + V3: việc đã xảy ra có liên quan hiện tại (just, yet, already).','for / since / ago':'for + khoảng thời gian; since + mốc thời gian; ago + khoảng thời gian (đi với quá khứ đơn).','Hiện tại hoàn thành hay quá khứ đơn':'Thời gian xác định (yesterday, in 2020) → quá khứ đơn; chưa xác định/còn liên quan hiện tại → hiện tại hoàn thành.','Câu hỏi quá khứ (Did…?)':'Did + S + V gốc?','Quá khứ phủ định':'didn\'t + V gốc (không chia V2 sau didn\'t).','How long…? (viết câu hỏi)':'How long + have/has + S + V3? cho việc kéo dài đến hiện tại.','gone hay been':'has gone = đã đi và chưa về; has been = đã đi và đã về.','just / already / yet':'just = vừa mới; already = rồi (câu khẳng định); yet = chưa/chưa? (phủ định, nghi vấn, cuối câu).','Câu bị động':'be + V3: hiện tại is/are, quá khứ was/were.','Sửa lỗi sai (viết lại câu đúng)':'Kiểm tra trợ động từ, thì và dạng động từ (V gốc / V-ed / V3).','Viết lại thành câu bị động':'Tân ngữ → chủ ngữ; be (cùng thì) + V3; "by …" có thể bỏ.','Tổng hợp các thì':'Dấu hiệu thời gian quyết định thì: now → tiếp diễn; since/for → hoàn thành; yesterday → quá khứ.','is / are / was / were / has / have':'is/are/was/were + V3 = bị động; has/have + V3 = hoàn thành.','Bị động từ gợi ý (viết cả câu)':'S + be + V3 (+ by …); chọn is/are/was/were theo thời gian.','Sửa lỗi sai (2)':'Kiểm tra trợ động từ, thì và dạng động từ (V gốc / V-ed / V3).','Chia động từ tổng hợp':'Tìm dấu hiệu thời gian rồi chọn thì; nhớ V3 khi là bị động hoặc hoàn thành.','Chọn đáp án đúng':'Xác định dấu hiệu thời gian rồi chọn thì.','Viết câu hỏi (thì tổng hợp)':'Đưa trợ động từ lên trước chủ ngữ; từ để hỏi đứng đầu câu.','Viết câu phủ định (thì tổng hợp)':'Thêm not sau trợ động từ; thì đơn dùng don\'t/doesn\'t/didn\'t + V gốc.','Chọn thì đúng (khó)':'Xác định dấu hiệu thời gian rồi chọn thì.','Dịch sang tiếng Anh':'Xác định thì từ ngữ cảnh: "đã … được 5 năm" → hiện tại hoàn thành; "được xây" → bị động.'};

['Đề 2 · Quá khứ đơn & tiếp diễn',[['While I ___ (walk) to school, I met an old friend.','was walking','Việc đang diễn ra (while) → was/were + V-ing; việc xen vào → quá khứ đơn.'],["We ___ (not / go) out last night because it rained.","didn't go",'Phủ định quá khứ đơn: didn\'t + V gốc.'],["Ask: What / you / do / at 8 o'clock last night?","what were you doing at 8 o'clock last night",'Thời điểm cụ thể trong quá khứ → was/were + S + V-ing.'],['Correct it: We was playing football when it started to rain.','we were playing football when it started to rain','Chủ ngữ we đi với were.'],['Ask: She / buy / a new bike?','did she buy a new bike','Quá khứ đơn nghi vấn: Did + S + V gốc?']]],
['Đề 3 · Hiện tại hoàn thành',[["I ___ (lose) my keys. I can't get in.","have lost",'Kết quả còn ở hiện tại → have/has + V3.'],['Ask: Tom / ever / be / to Japan?','has tom ever been to japan','Kinh nghiệm: Have/Has + S + ever + V3 (be → been).'],['Sue is not here. She ___ (go) out. (She has not come back.)','has gone','has gone = đã đi và chưa về; has been = đã đi và đã về.'],['Add "yet": They have not arrived.','they have not arrived yet','yet đứng cuối câu phủ định/nghi vấn.'],['Add "already": She has finished her work.','she has already finished her work','already đứng giữa have/has và V3.']]],
['Đề 4 · for / since / ago & How long',[['I have lived here ___ 2018. (for / since / ago)','since','since + mốc thời gian.'],['Ask: How long / you / know / Anna?','how long have you known anna','How long + have/has + S + V3 (know → known).'],['Correct it: I am living here for ten years.','i have lived here for ten years/i have been living here for ten years','for + khoảng thời gian kéo dài đến nay → hiện tại hoàn thành.'],['They arrived two hours ___. (for / since / ago)','ago','ago + khoảng thời gian, đi với quá khứ đơn.'],['Mozart ___ many operas. (write)','wrote','Mozart đã mất, việc đã kết thúc → quá khứ đơn.']]],
['Đề 5 · Bị động (hiện tại & quá khứ)',[['English ___ (speak) in many countries.','is spoken','Sự thật hiện tại → is/are + V3.'],['Rewrite in the passive: Someone stole my car last night.','my car was stolen last night','Quá khứ đơn bị động: was/were + V3.'],['Ask: When / this bridge / build?','when was this bridge built','Nghi vấn bị động: từ hỏi + was/were + S + V3.'],['Make it negative: The letters are sent every day.',"the letters aren't sent every day",'Phủ định bị động: be + not + V3.'],['Rewrite in the passive: They make these shoes in Italy.','these shoes are made in italy','Tân ngữ làm chủ ngữ; be cùng thì với động từ gốc.']]],
['Đề 6 · Bị động nâng cao',[['The road ___ (repair) at the moment.','is being repaired','Đang diễn ra → is/are being + V3.'],['Somebody has broken the window. → The window ___.','has been broken','Hoàn thành bị động: has/have been + V3.'],['Rewrite in the passive: They are building a new hospital.','a new hospital is being built','Tiếp diễn bị động: is/are being + V3.'],["I ___ (not / invite) to the party, so I stayed home.","wasn't invited",'Quá khứ bị động phủ định: wasn\'t/weren\'t + V3.'],['My car ___ stolen last week. (was / has been)','was','last week là thời gian xác định → quá khứ đơn.']]],
['Đề 7 · Sửa lỗi sai',[["She don't like coffee.","she doesn't like coffee",'Chủ ngữ she đi với doesn\'t.'],['I have seen him yesterday.','i saw him yesterday','yesterday → quá khứ đơn.'],['Did you went to school?','did you go to school','Sau did dùng V gốc.'],['The window was broke by Tom.','the window was broken by tom','Bị động dùng V3 (broken).'],['How long do you know Peter?','how long have you known peter','How long + hiện tại hoàn thành.']]],
['Đề 8 · Đặt câu hỏi & phủ định',[['Ask a question: She works in a bank. (Where …?)','where does she work','Where + does + S + V gốc.'],['Make it negative: He has finished his homework.',"he hasn't finished his homework",'Hoàn thành phủ định: haven\'t/hasn\'t + V3.'],['Make it negative: They were playing football.',"they weren't playing football",'Quá khứ tiếp diễn phủ định: wasn\'t/weren\'t + V-ing.'],['Ask a question: They went to Spain. (Where …?)','where did they go','Where + did + S + V gốc.'],['Ask a question: The letter was posted yesterday. (When …?)','when was the letter posted','Bị động: When + was + S + V3.']]],
['Đề 9 · Tổng hợp các thì A',[['She ___ (live) in Hue since 2015.','has lived/has been living','since + mốc thời gian → hiện tại hoàn thành.'],['When I arrived, everybody ___ (dance).','was dancing','Việc đang diễn ra khi việc khác xảy ra.'],['I ___ (never / eat) sushi.','have never eaten','never + hiện tại hoàn thành: kinh nghiệm.'],['These cars ___ (make) in Japan every year.','are made','Sự thật + bị động → is/are + V3.'],['Look! It ___ (snow).','is snowing','Look! → hiện tại tiếp diễn.']]],
['Đề 10 · Dịch & tổng hợp B',[['Dịch: Tôi đã sống ở đây được 5 năm.','i have lived here for five years/i have lived here for 5 years','"được 5 năm" → for + hiện tại hoàn thành.'],['Dịch: Cái cầu này được xây năm 1990.','this bridge was built in 1990','năm 1990 → quá khứ; được xây → bị động: was built.'],['Dịch: Hôm qua tôi không đi học.',"i didn't go to school yesterday",'yesterday → quá khứ đơn phủ định.'],['Dịch: Bạn đã bao giờ đến Nhật chưa?','have you ever been to japan','Kinh nghiệm: Have you ever been to …?'],['Dịch: Con đường đang được sửa.','the road is being repaired','"đang được" → is being + V3.']]]];

Object.assign(NOTE,{'am / is / are / do / does':'Với động từ to be: I → am; he/she/it → is; you/we/they → are. Với động từ thường, ta mượn do/does để đặt câu hỏi và câu phủ định (does đi với he/she/it). Ví dụ: Does she work here? / They are at home.','Hiện tại tiếp diễn':'Cấu trúc: am/is/are + V-ing. Dùng cho việc đang xảy ra ngay lúc nói hoặc quanh thời điểm nói; dấu hiệu: now, at the moment, Look!, Listen! Phủ định thêm not sau am/is/are. Ví dụ: She is cooking dinner now.','Hiện tại đơn':'Dùng cho thói quen, sự thật, lịch cố định. Với he/she/it, động từ thêm -s/-es (works, goes). Câu hỏi và phủ định mượn do/does + V gốc, lúc đó động từ chính không thêm -s. Ví dụ: She doesn\'t like coffee.','have got':'have/has got diễn tả sở hữu (= have). Phủ định: haven\'t/hasn\'t got. Câu hỏi đảo have/has lên đầu: Has she got a car? Chủ ngữ he/she/it dùng has, các chủ ngữ còn lại dùng have.','was / were':'Quá khứ của to be: I/he/she/it → was; you/we/they → were. Phủ định: wasn\'t/weren\'t. Câu hỏi đảo was/were lên trước chủ ngữ: Were you at home last night?','Viết dạng rút gọn':'Dạng rút gọn nối trợ động từ với chủ ngữ hoặc với not: I am → I\'m, she is → she\'s, is not → isn\'t, have not → haven\'t, was not → wasn\'t. Lưu ý: will not → won\'t và can not → can\'t là trường hợp đặc biệt.','Thêm -s / -es':'Với he/she/it ở hiện tại đơn: động từ kết thúc bằng -o, -ch, -sh, -s, -x thêm -es (goes, watches); phụ âm + y đổi y thành -ies (study → studies); còn lại thêm -s. Riêng have → has.','Trả lời ngắn':'Câu trả lời ngắn lặp lại trợ động từ trong câu hỏi, không lặp động từ chính: Do you like tea? → Yes, I do. / No, I don\'t. Is she tired? → Yes, she is. Chủ ngữ trong câu hỏi được đổi thành đại từ (Tom → he).','Từ để hỏi':'Who hỏi người; Where hỏi nơi chốn; Why hỏi lý do; How much hỏi giá/số lượng không đếm được; How many hỏi số lượng đếm được; What time hỏi giờ; How often hỏi tần suất. Câu trả lời cho biết nên dùng từ nào.','Trạng từ chỉ tần suất (viết lại cả câu)':'Always, usually, often, sometimes, never đứng trước động từ thường (She usually walks) nhưng đứng sau am/is/are (She is never late). Trong câu hỏi, trạng từ đứng sau chủ ngữ: Do you often go out?','Quá khứ đơn':'Dùng cho việc đã xảy ra và kết thúc ở thời điểm xác định (yesterday, last week, in 2019). Động từ có quy tắc thêm -ed; bất quy tắc phải học thuộc (go → went). Phủ định: didn\'t + V gốc.','Quá khứ tiếp diễn và đơn':'Việc đang diễn ra trong quá khứ dùng was/were + V-ing; việc ngắn xen vào dùng quá khứ đơn. Ví dụ: I was walking home when I met Sarah. While thường đi với quá khứ tiếp diễn.','Hiện tại hoàn thành':'Cấu trúc: have/has + V3. Dùng khi việc xảy ra trong quá khứ nhưng còn liên quan đến hiện tại (kết quả, kinh nghiệm), không nêu thời gian cụ thể. Hay đi với just, already, yet, ever, never.','for / since / ago':'for + khoảng thời gian (for three years); since + mốc thời gian (since 2018); ago + khoảng thời gian, dùng với quá khứ đơn (two hours ago). For và since đi với hiện tại hoàn thành.','Hiện tại hoàn thành hay quá khứ đơn':'Có thời gian xác định trong quá khứ (yesterday, last year, in 2020) hoặc người/việc đã kết thúc (Mozart) → quá khứ đơn. Chưa nêu thời gian, còn liên quan hiện tại hoặc nói về kinh nghiệm → hiện tại hoàn thành.','Câu hỏi quá khứ (Did…?)':'Câu hỏi quá khứ đơn: Did + S + V gốc (không chia V2 sau did). Từ hỏi đứng đầu: Where did you go? Chủ ngữ ở câu trả lời được đổi sang đại từ phù hợp khi cần.','Quá khứ phủ định':'Phủ định quá khứ đơn: didn\'t (did not) + V gốc. Vì did đã mang thì quá khứ nên động từ chính trở về nguyên mẫu: I didn\'t see her (không phải didn\'t saw).','How long…? (viết câu hỏi)':'How long + have/has + S + V3? hỏi việc kéo dài từ quá khứ đến hiện tại. Ví dụ: How long have you lived here? Với to be: How long has she been ill? Câu trả lời thường dùng for hoặc since.','gone hay been':'has/have gone to = đã đi đến đó và vẫn chưa về; has/have been to = đã đến đó rồi và đã quay về (kinh nghiệm). Ví dụ: She\'s gone to Paris (cô ấy đang ở Paris) / She\'s been to Paris (cô ấy từng đến).','just / already / yet':'just = vừa mới (đứng giữa have/has và V3); already = rồi, sớm hơn dự kiến (câu khẳng định); yet = chưa/đã chưa (phủ định và nghi vấn, đứng cuối câu).','Câu bị động':'Cấu trúc: be + V3 (hoặc V-ed). Chọn be theo thì: hiện tại is/are; quá khứ was/were; hoàn thành has/have been; tiếp diễn is/are being. Dùng khi người làm không quan trọng hoặc không rõ. [[PASSIVE]] Ví dụ: English is spoken here.','Sửa lỗi sai (viết lại câu đúng)':'Cách kiểm tra từng bước: (1) xác định thì từ dấu hiệu thời gian, (2) kiểm tra trợ động từ có hợp chủ ngữ không, (3) kiểm tra dạng động từ (V gốc sau did/does, V3 sau have/be bị động).','Viết lại thành câu bị động':'Ba bước: đưa tân ngữ (O) lên làm chủ ngữ; đổi động từ thành be (cùng thì với câu gốc) + V3; thêm by + người làm hoặc bỏ đi. [[PASSIVE]]','Tổng hợp các thì':'Dấu hiệu thời gian quyết định thì: now/Look → tiếp diễn; every day/usually → đơn; yesterday/ago → quá khứ đơn; since/for/ever/never/just → hiện tại hoàn thành; while/when kèm việc đang diễn ra → quá khứ tiếp diễn.','is / are / was / were / has / have':'is/are/was/were + V3 là câu bị động (thì hiện tại hoặc quá khứ); has/have + V3 là hiện tại hoàn thành (chủ động). Chủ ngữ số ít dùng is/was/has, số nhiều dùng are/were/have. [[PASSIVE]]','Bị động từ gợi ý (viết cả câu)':'Sắp xếp theo mẫu: S + be + V3 (+ by …). Chọn be theo thời gian của câu: hiện tại is/are; quá khứ was/were; hoàn thành has/have been; tiếp diễn is/are being. Câu hỏi bị động đảo be lên trước chủ ngữ. [[PASSIVE]] Ví dụ: When was it built?','Sửa lỗi sai (2)':'Cách kiểm tra từng bước: (1) xác định thì từ dấu hiệu thời gian, (2) kiểm tra trợ động từ có hợp chủ ngữ không, (3) kiểm tra dạng động từ (V gốc sau did/does, V3 sau have hoặc be bị động).','Chia động từ tổng hợp':'Tìm dấu hiệu thời gian trước rồi mới chia: yesterday/last → quá khứ đơn; while/when → quá khứ tiếp diễn; since/for/ever/just → hiện tại hoàn thành; trong câu bị động nhớ dùng V3 sau be.','Chọn đáp án đúng':'Đọc kỹ dấu hiệu thời gian trong câu (since, yesterday, at the moment, while, yet…) rồi mới chọn thì; loại dần các đáp án sai về dạng động từ hoặc về trợ động từ.','Viết câu hỏi (thì tổng hợp)':'Quy tắc: đưa trợ động từ (am/is/are, was/were, do/does/did, have/has) lên trước chủ ngữ; nếu có từ hỏi thì đặt ở đầu câu. Câu không có trợ động từ thì mượn do/does/did và đưa động từ về nguyên mẫu.','Viết câu phủ định (thì tổng hợp)':'Thêm not sau trợ động từ (is not, was not, has not). Với thì đơn mượn do/does/did + not + V gốc. Với bị động thêm not sau be: The window wasn\'t broken.','Chọn thì đúng (khó)':'Xác định dấu hiệu thời gian rồi chọn thì: việc đã kết thúc (lived, wrote) khác với việc còn kéo dài (has lived); việc đang xảy ra tại một thời điểm quá khứ dùng quá khứ tiếp diễn.','Dịch sang tiếng Anh':'Xác định thì từ ngữ cảnh tiếng Việt: "đã … được 5 năm" → hiện tại hoàn thành + for; "hôm qua" → quá khứ đơn; "đang được sửa" → is being + V3; "đã bao giờ" → Have you ever + V3.'});

Object.assign(NOTE,{'used to':'Cấu trúc: used to + V gốc, diễn tả thói quen hoặc trạng thái trong quá khứ nhưng nay không còn. Phủ định và nghi vấn mượn did: did not use to / Did you use to…? (use, không có -d). Ví dụ: She used to live in Paris. / Did you use to play tennis?','Tương lai: What are you doing tomorrow?':'Dùng am/is/are + V-ing cho kế hoạch đã sắp xếp trong tương lai, thường có thời gian cụ thể (tomorrow, tonight, next Friday). Câu hỏi đảo am/is/are lên trước chủ ngữ. Ví dụ: I am meeting Sarah at 7 tonight.','going to':'am/is/are going to + V gốc: dự định đã quyết định, hoặc dự đoán dựa trên dấu hiệu hiện tại (Look at those clouds!). Phủ định thêm not sau am/is/are; câu hỏi đảo am/is/are. Ví dụ: It is going to rain. / Are you going to buy a car?','will / shall (1)':'will + V gốc dùng để nói về tương lai, dự đoán hoặc điều bạn nghĩ sẽ xảy ra (I think, I’m sure, probably). Phủ định: will not (won’t). Shall chỉ đi với I/we, dùng để đề nghị hoặc rủ rê. Ví dụ: She will pass the exam. / Shall I open the window?','will / shall (2)':'Dùng I will (I’ll) khi quyết định hoặc đề nghị giúp ngay lúc nói; won’t = từ chối hoặc hứa không làm. Shall I…? để đề nghị, Shall we…? để rủ. Không dùng going to cho quyết định tức thời. Ví dụ: “It’s cold.” “I’ll close the window.”','might':'might + V gốc nghĩa là có thể (khả năng không chắc chắn), gần nghĩa với perhaps. Phủ định: might not. Không thêm to và không chia theo ngôi. Ví dụ: He might be at home. / It might rain later.','can / could':'can/could + V gốc (không có to). can = khả năng hiện tại, could = khả năng quá khứ hoặc lời yêu cầu lịch sự. Phủ định: cannot (can’t), could not (couldn’t). Ví dụ: I could swim when I was five. / Could you help me?','must · mustn’t · needn’t':'must = bắt buộc/cần thiết; mustn’t = bị cấm (không được phép); needn’t = không cần thiết nhưng không bị cấm. Tất cả + V gốc, không có to. Ví dụ: You mustn’t park here. / You needn’t hurry.','should':'should + V gốc để khuyên nên làm; shouldn’t để khuyên không nên. Không có to và không đổi theo ngôi. Câu hỏi xin lời khuyên: What should I do? Ví dụ: You look tired. You should go to bed early.','have to':'have/has to + V gốc = bắt buộc phải làm do quy định hay hoàn cảnh. Phủ định don’t/doesn’t have to = không cần phải (khác với mustn’t). Quá khứ: had to; hỏi và phủ định quá khứ dùng did + have to. Ví dụ: She has to wear a uniform. / Did Tom have to pay?','Would you like…? I’d like…':'Would you like…? dùng để mời hoặc đề nghị lịch sự; I’d like… (= I would like) để yêu cầu lịch sự. would like + to V hoặc + danh từ. Khác với Do you like…? (hỏi sở thích). Ví dụ: Would you like some tea? / I’d like to go home.','there is / there are':'There is + danh từ số ít hoặc không đếm được; there are + danh từ số nhiều. Phủ định: there isn’t / there aren’t. Câu hỏi đảo: Is there…? / Are there…? Động từ chia theo danh từ đứng sau. Ví dụ: There are two beds in the room.','there was / there were / there will be':'Quá khứ: there was (số ít) / there were (số nhiều); tương lai: there will be cho cả số ít và số nhiều. Phủ định: wasn’t / weren’t / won’t be; hỏi: Was there…? Were there…? Ví dụ: There were many people at the party.','It…':'It dùng làm chủ ngữ khi nói về giờ giấc, ngày, thời tiết, khoảng cách. Không được bỏ chủ ngữ it như tiếng Việt. How far is it…? hỏi khoảng cách; What time is it? hỏi giờ. Ví dụ: It is raining. / It is three kilometres from here.','I am, I don’t…':'Khi không muốn lặp lại cả câu, chỉ giữ trợ động từ: I am / I’m not / she does / he doesn’t / I can / I did. Trợ động từ phải khớp với câu gốc. Ví dụ: She isn’t tired but he is. / He likes tea but she doesn’t.','Have you? Are you? Don’t you?…':'Dùng trợ động từ + đại từ để thể hiện sự quan tâm khi nghe người khác nói; trợ động từ khớp với câu của họ (did → did you?, isn’t → isn’t she?). Ví dụ: “I bought a new car.” “Oh, did you?”','too / either · so am I / neither do I':'too dùng ở cuối câu khẳng định; either dùng ở cuối câu phủ định. So + trợ động từ + I = tôi cũng vậy; Neither + trợ động từ + I = tôi cũng không. Trợ động từ khớp với câu gốc. Ví dụ: “I’m tired.” “So am I.”','Câu phủ định (isn’t, haven’t, don’t…)':'Thêm not sau am/is/are/was/were/have/has/can/will/should. Động từ thường ở hiện tại dùng don’t/doesn’t + V gốc; quá khứ dùng didn’t + V gốc. Ví dụ: She does not like tea. / We did not go out.','Câu hỏi 1 (is it…? have you…? do they…?)':'Câu hỏi đảo trợ động từ lên trước chủ ngữ. Nếu câu khẳng định không có trợ động từ thì mượn do/does/did (và động từ về nguyên mẫu). Từ để hỏi đứng đầu câu. Ví dụ: Does he like pizza? / Where does Tom live?','Câu hỏi 2 (Who saw you? Who did you see?)':'Khi who/what là chủ ngữ thì không cần do/does/did: Who saw Paul? Khi who/what là tân ngữ thì cần trợ động từ: Who did Sylvia see? Hỏi “ai làm” khác với hỏi “làm gì/ai”. Ví dụ: What happened? / What did Tom buy?','Câu hỏi 3 (Who is she talking to?)':'Giới từ (to, for, with, from, about…) thường đứng cuối câu hỏi, sau động từ. Cấu trúc: Who/What + trợ động từ + S + V + giới từ? Ví dụ: Who is she talking to? / What are they looking for? / What is the film like?','What…? Which…? How…?':'What + danh từ hỏi chung (What colour/kind…?); Which dùng khi chọn trong một nhóm giới hạn; How + tính từ/trạng từ hỏi mức độ (How old/far/much…?). What … like? hỏi đặc điểm. Ví dụ: Which bus goes to the airport?','How long does it take…?':'How long does it take (to) …? hỏi thời gian cần để làm gì. Trả lời: It takes + thời gian (+ by train…). Khi có người: It takes/took + người + thời gian + to V. Ví dụ: It took me three hours to write the report.','Do you know where…?':'Trong câu hỏi gián tiếp (Do you know…? / Can you tell me…?), từ hỏi được theo sau bởi trật tự câu khẳng định: không đảo trợ động từ, không dùng do/does/did. Câu yes/no dùng if hoặc whether. Ví dụ: Do you know where the station is?','said / told (câu tường thuật)':'Khi tường thuật, thì lùi một bậc: am/is → was, like → liked, will → would, can → could, have lost → had lost. said that + câu; told + người + that. Ví dụ: Tom said that he was tired. / She told me that she was hungry.','Động từ nguyên mẫu và -ing':'Sau can/must/will/should… dùng V gốc. Sau enjoy, stop, be good at, thinking of… dùng V-ing. Sau want, would like, decide… dùng to + V. Phải học theo từng động từ. Ví dụ: I enjoy reading. / I want to learn English.'});
